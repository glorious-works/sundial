name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The main-branch ruleset requires this job by name. Keep it "check".
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/eslint
      - run: npm run build
